<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conrado • Motorista</title>
<style>
:root{font:16px system-ui;color:#17304d;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{background:#102847;color:white;padding:23px}header h1{font-size:23px;margin:0}header small{opacity:.7}main{max-width:650px;margin:auto;padding:18px}.card{background:white;border:1px solid #d8e2eb;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #1630500d}h2{font-size:19px}label{display:block;margin:12px 0;font-weight:650}input,select,textarea{width:100%;border:1px solid #c8d4df;border-radius:9px;padding:12px;font:inherit;margin-top:5px}button{background:#1765a7;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#61758a;font-size:13px}.tag{display:inline-block;background:#e9f1fa;border-radius:20px;padding:5px 10px;font-size:12px;color:#235a91}.error{background:#ffe7e7;padding:12px;color:#8c2525;border-radius:9px}.ok{background:#e1f7e6;padding:12px;color:#1a5831;border-radius:9px}.note{border-left:4px solid #2078b8;padding:10px;margin:10px 0;background:#f8fbfe}
</style></head><body><header><h1>Conrado Entregas</h1><small>Área do motorista • versão experimental</small></header><main>
<section class="card" id="loginBox"><h2>Entrar na viagem</h2><form id="login"><label>Placa do caminhão<input name="plate" placeholder="ABC-1D23" required autocapitalize="characters"></label><label>Senha individual<input name="password" type="password" required></label><button>Entrar</button></form></section>
<section id="trip" hidden></section><div id="msg" role="status"></div><p class="muted">Teste local: as ocorrências podem ser registradas, mas entregas concluídas ainda exigirão o módulo de fotografia do canhoto. Não utilize este protótipo em rota real.</p>
</main><script>
let session='';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function notify(text,error=false){$('msg').innerHTML=`<p class="${error?'error':'ok'}">${esc(text)}</p>`}
async function request(url,body){const res=await fetch(url,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+session,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const value=await res.json();if(!res.ok)throw Error(value.erro||'Falha na conexão');return value}
async function refresh(){const data=await request('/api/driver/trip');if(!data.trip){$('trip').innerHTML='<section class="card">Nenhuma viagem liberada para você neste momento.</section>';return}
const t=data.trip;$('trip').innerHTML=`<section class="card"><span class="tag">VIAGEM ATUAL</span><h2>${esc(t.label)}</h2><p>Placa ${esc(t.plate)} • ${t.notes.length} nota(s)</p></section>`+t.notes.map(n=>`<section class="card"><div class="note"><strong>${esc(n.recipient)}</strong><p class="muted">${esc(n.address)}</p><div>NF-e ${esc(n.number)} • <span class="tag">${esc(n.status)}</span></div></div><label>Ocorrência<select id="status-${n.id}"><option value="occurrence">Ocorrência geral</option><option value="partial">Entrega parcial</option><option value="refused">Recusa</option></select></label><label>Motivo/observação<textarea id="reason-${n.id}" rows="3" maxlength="1000" placeholder="Descreva o que aconteceu"></textarea></label><button onclick="record(${n.id})">Registrar ocorrência</button></section>`).join('')}
async function record(id){const event_id=crypto.randomUUID();try{await request(`/api/driver/notes/${id}/status`,{event_id,status:$('status-'+id).value,reason:$('reason-'+id).value});notify('Ocorrência registrada no sistema.');await refresh()}catch(e){notify(e.message,true)}}
$('login').onsubmit=async e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));try{const result=await request('/api/driver/login',values);session=result.token;$('loginBox').hidden=true;$('trip').hidden=false;await refresh();notify('Login realizado.')}catch(e){notify(e.message,true)}};
</script></body></html>
